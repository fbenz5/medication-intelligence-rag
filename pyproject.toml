[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "medication-intelligence-rag"
version = "0.1.0"
description = "Production-grade RAG platform for evidence-grounded medication information."
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.109.1,<2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "ragas==0.3.9",
    "langchain==0.3.27",
    "langchain-core==0.3.79",
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "instructor<1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]